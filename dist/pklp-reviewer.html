<!doctype html>
<html lang="tl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PKLP T2 — Summative 2</title>
    <link rel="stylesheet" href="style.css?v=floating-language-2">
    <style>
        #lang { position: static; box-shadow: none; white-space: normal; }
        #lang.is-floating { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; bottom: auto; z-index: 20; max-width: calc(100vw - 24px); padding: 10px 14px; box-shadow: 0 10px 28px #0009; white-space: nowrap; }
        @media (max-width: 550px) { #lang.is-floating { top: max(8px, env(safe-area-inset-top)); right: 8px; bottom: auto; } }
    </style>
</head>

<body>
    <a href="index.html" style="position:fixed;top:10px;left:10px;z-index:30;color:#d9e4df;font-family:Outfit,system-ui,sans-serif;font-weight:700;text-decoration:none;background:#202c34;border:1px solid #394955;border-radius:999px;padding:9px 14px">← Reviewer library</a>
    <main>
        <header>
            <div>
                <p class="eyebrow" id="eyebrow">PKLP T2 — SUMMATIVE 2</p>
                <h1 id="title">*quote here*</h1>
            </div><button id="lang" aria-label="Translate language">Translate to English</button>
        </header>
        <section class="status"><span id="progress">10 questions selected</span><button id="reset">New random
                set</button></section>
        <form id="exam"></form>
        <section class="submitbar"><div><button id="submit" type="button">Submit answers</button></div>
            <p id="score" aria-live="polite"></p>
        </section>
        <footer class="page-footer">“making this review was the review” - yousef</footer>
    </main><template id="question">
        <article class="question">
            <div class="qhead"><span class="number"></span><span class="tag">MOCK EXAM</span></div>
            <h2></h2>
            <div class="options"></div>
            <div class="feedback" hidden><strong></strong>
                <p></p>
            </div>
        </article>
    </template>
    <script src="app.js?v=deck-shuffle-1"></script>
    <script src="float-language.js?v=1"></script>
</body>

</html>
